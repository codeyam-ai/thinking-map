name: CI

# Verification runs on pull requests, which is the moment a change can still be
# reversed cheaply. The existing `deploy-production.yml` triggers on push to
# `main` and is gated on the `production` environment, so a check bolted onto it
# would only ever report history — it would never see a pull request.
on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same branch supersedes an in-flight run: nothing here
# touches shared state, so cancelling costs nothing but saves runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `postinstall` runs `scripts/postinstall.mjs`, which skips the ~150MB
      # Playwright browser download when `CI` is set. Nothing in this workflow
      # captures screenshots, so there is nothing to install.
      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated, not committed. Without this step the
      # type-check fails on model fields that exist in `schema.prisma` but not
      # in whatever client happens to be on disk.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      # The DB-backed tests start their own PostgreSQL (`app/lib/testDatabase.ts`)
      # and stop it afterwards, so no service container is needed. Leaving
      # `TEST_DATABASE_URL` unset is what selects that path.
      - name: Run tests
        run: npm test

      # `next build` reads `DATABASE_URL` while collecting route configuration
      # and throws when it is missing — but it never opens a connection, so a
      # placeholder is enough. Real credentials belong to the deploy workflow.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
